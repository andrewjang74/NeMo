name: speechllm_combined

data:
  common:
    global_batch_size: 8
    micro_batch_size: 4
    max_seq_length: 2048
    min_seq_length: 1
    sample_rate: 16000
    end_string: null
    context_key: 'context'
    answer_key: 'answer'
    prompt_format: 'gpt' # Using generic GPT format
    tokens_to_generate: 128
    add_boa_eoa: false

  train_ds:
    manifest_filepath: ??? 
    global_batch_size: ${data.common.global_batch_size}
    micro_batch_size: ${data.common.micro_batch_size}
    shuffle: True
    num_workers: 4
    pin_memory: True
    max_seq_length: ${data.common.max_seq_length}
    min_seq_length: ${data.common.min_seq_length}
    drop_last: True
    context_key: ${data.common.context_key}
    answer_key: ${data.common.answer_key}
    text_field: ${data.common.answer_key}
    end_string: ${data.common.end_string}
    add_eos: true
    add_sep: false
    add_bos: false
    separate_prompt_and_response_with_newline: false
    truncation_field: 'context'
    prompt_template: "Q: {context}\nA: {answer}"
    sample_rate: ${data.common.sample_rate}
    max_duration: 20
    min_duration: 0.1
    is_concat: false
    is_tarred: false
    tarred_audio_filepaths: null
    shuffle_n: 2048
    bucketing_strategy: "fully_randomized"
    bucketing_batch_size: null
    audio_locator: null
    prompt_format: ${data.common.prompt_format}

  validation_ds:
    manifest_filepath: ???
    global_batch_size: ${data.common.global_batch_size}
    micro_batch_size: ${data.common.micro_batch_size}
    shuffle: False
    num_workers: 4
    pin_memory: True
    max_seq_length: ${data.common.max_seq_length}
    min_seq_length: ${data.common.min_seq_length}
    drop_last: true
    context_key: ${data.common.context_key}
    answer_key: ${data.common.answer_key}
    text_field: ${data.common.answer_key}
    add_eos: true
    end_string: ${data.common.end_string}
    add_sep: false
    add_bos: false
    separate_prompt_and_response_with_newline: false
    output_file_path_prefix: null
    truncation_field: 'context'
    index_mapping_dir: null
    prompt_template: ${data.common.prompt_template}
    tokens_to_generate: ${data.common.tokens_to_generate}
    write_predictions_to_file: False
    sample_rate: ${data.common.sample_rate}
    audio_locator: null
    prompt_format: ${data.common.prompt_format}
    log_every_n_steps: 10
    metric:
      name: "loss"
      average: null
      num_classes: null

model:
  freeze_language_model: false # Train the small LLM
  freeze_speech_model: true    # Freeze the ASR encoder
  freeze_modality_adapter: false
  
  llm:
    pretrained_model: null # Will be loaded from checkpoint if provided, or initialized from config
    _target_: nemo.collections.llm.GPTModel
    config: 
      _target_: nemo.collections.llm.GPTConfig
      num_layers: 12
      hidden_size: 512
      num_attention_heads: 8
      max_position_embeddings: 2048
      ffn_hidden_size: 2048
      activation_func: 'gelu'
      bias: true
      normalization: 'layernorm'
      layernorm_epsilon: 1e-5
      vocab_size: 32000 # Adjust based on tokenizer
    
  speech_encoder:
    pretrained_model: ??? # Path to Stage 1 .nemo file
    target_module: "encoder"
    sample_rate: ${data.common.sample_rate}
    spec_augment_config:
      _target_: nemo.collections.asr.modules.SpectrogramAugmentation
      freq_masks: 0
      time_masks: 0
      freq_width: 27
      time_width: 0.05

  modality_adapter:
    input_key_from: "d_model"
    input_key_to: "feat_in"
    output_key: "num_classes"
    config:
      _target_: nemo.collections.asr.modules.ConvASRDecoder
      feat_in: -1
      num_classes: -1
      add_blank: false

optim:
  _target_: nemo.lightning.MegatronOptimizerModule
  config:
    _target_: megatron.core.optimizer.OptimizerConfig
    optimizer: adam
    lr: 1e-4
    clip_grad: 1.0
    weight_decay: 0.0001
  lr_scheduler:
    _target_: nemo.lightning.pytorch.optim.CosineAnnealingScheduler
    max_steps: ${trainer.max_steps}
    warmup_steps: 250
    constant_steps: 10000
    min_lr: 5e-5

trainer:
  devices: 1
  accelerator: gpu
  num_nodes: 1
  max_epochs: -1 
  max_steps: 100000
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  val_check_interval: 1000
  num_sanity_val_steps: 0
  sync_batchnorm: true

strategy:
  _target_: nemo.collections.speechlm.strategies.SpeechLMMegatronStrategy
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  ckpt_async_save: true

callbacks:
  checkpoint:
    _target_: nemo.lightning.pytorch.callbacks.ModelCheckpoint
    filename: '${name}--{${callbacks.checkpoint.monitor}:.5f}-{step}'
    monitor: "val_loss"
    mode: "min"
    save_last: true
    save_top_k: 1
    save_weights_only: false
    always_save_context: true

plugins:
  _target_: nemo.lightning.MegatronMixedPrecision
  precision: "bf16-mixed"
  autocast_enabled: null

resume:
  _target_: nemo.collections.speechlm.utils.resume.SpeechLMAutoResume
  resume_from_directory: null
  resume_from_path: null
  adapter_path: null
  resume_if_exists: true
  resume_past_end: false
  resume_ignore_no_checkpoint: true

logger:
  _target_: nemo.lightning.NeMoLogger
  log_dir: null
  name: ${name}
  wandb:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: null
    name: ${logger.name}
    resume: false
